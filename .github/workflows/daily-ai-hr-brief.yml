name: Daily AI HR Brief

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional backfill start date, YYYY.MM.DD"
        required: false
        type: string
      end_date:
        description: "Optional backfill end date, YYYY.MM.DD"
        required: false
        type: string
      replace_existing:
        description: "Delete existing Feishu document content before publishing"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Generate and publish brief
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOCUMENT_ID: ${{ secrets.FEISHU_DOCUMENT_ID }}
          FEISHU_ROOT_BLOCK_ID: ${{ secrets.FEISHU_ROOT_BLOCK_ID }}
          FEISHU_REFRESH_TOKEN: ${{ secrets.FEISHU_REFRESH_TOKEN }}
          FEISHU_USER_ACCESS_TOKEN: ${{ secrets.FEISHU_USER_ACCESS_TOKEN }}
          FEISHU_TOKEN_OUTPUT_PATH: output/feishu_refresh_token.txt
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          REPLACE_EXISTING: ${{ inputs.replace_existing }}
        run: |
          args=(--publish-feishu --output-dir output)
          if [ -n "${START_DATE:-}" ] && [ -n "${END_DATE:-}" ]; then
            args+=(--start-date "$START_DATE" --end-date "$END_DATE" --allow-backfill)
          fi
          if [ "${REPLACE_EXISTING:-false}" = "true" ]; then
            args+=(--replace-feishu)
          fi
          python3 scripts/ai_hr_daily_brief.py "${args[@]}"
      - name: Rotate Feishu refresh token secret
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_PAT }}
        run: |
          if [ ! -s output/feishu_refresh_token.txt ]; then
            echo "No rotated Feishu refresh token was produced."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FEISHU_REFRESH_TOKEN was rotated, but GH_SECRET_PAT is not configured. Add a GitHub token that can write repository secrets, then re-run."
            exit 1
          fi
          token="$(cat output/feishu_refresh_token.txt)"
          echo "::add-mask::$token"
          gh secret set FEISHU_REFRESH_TOKEN --body "$token"
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-hr-daily-brief
          path: |
            output/**/*.md
            output/**/verification_report.json
